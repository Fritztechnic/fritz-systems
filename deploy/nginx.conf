server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Inline-Skripte: Theme-Weiche in app.html und SvelteKit-Start
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css text/plain application/javascript application/xml image/svg+xml;

    error_page 404 /404.html;

    location /_app/immutable/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }
}
