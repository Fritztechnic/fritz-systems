apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
spec:
  replicas: 2
  selector:
    matchLabels: {app: portfolio}
  template:
    metadata:
      labels: {app: portfolio}
    spec:
      containers:
        - name: web
          # Image liegt per `ctr import` auf allen Nodes; kein Registry-Pull.
          image: docker.io/library/fritz-systems:7
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
spec:
  selector: {app: portfolio}
  ports:
    - {port: 80, targetPort: http, name: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - secretName: portfolio-tls
      hosts: [fritz.systems]
  rules:
    - host: fritz.systems
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: portfolio, port: {name: http}}}}
